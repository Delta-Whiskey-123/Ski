<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Spike A: real 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#dfe8f2;touch-action:none}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { createSim, createHud, ground, treesInBand, gateAt, kickerY, KICKER, PERIOD } from './sim.js';

const sim = createSim();
const hud = createHud('Spike A: real 3D');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe4ebf4);
scene.fog = new THREE.Fog(0xe4ebf4, 70, 130);
const camera = new THREE.PerspectiveCamera(38, 1, 1, 200);

scene.add(new THREE.HemisphereLight(0xa9c4ff, 0xfff4e6, 1.15));
const sun = new THREE.DirectionalLight(0xffe2bd, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55, near: 1, far: 160 });
sun.shadow.bias = -0.0015;
scene.add(sun, sun.target);

// ---- snow with a generated corduroy texture
function snowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fbfcff'; g.fillRect(0, 0, 128, 128);
  for (let x = 0; x < 128; x += 8) { g.fillStyle = 'rgba(150,175,215,.20)'; g.fillRect(x, 0, 3, 128); }
  for (let i = 0; i < 260; i++) {
    g.fillStyle = `rgba(140,165,210,${Math.random() * 0.18})`;
    g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2 + Math.random() * 5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(60, 60);
  t.anisotropy = 4; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const snow = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshLambertMaterial({ map: snowTexture() }));
snow.rotation.x = -Math.PI / 2; snow.receiveShadow = true; scene.add(snow);

const mat = (color) => new THREE.MeshLambertMaterial({ color, flatShading: true });
const shadowed = (m) => { m.castShadow = true; return m; };

// ---- trees (pooled and recycled as the rider descends)
const trunkGeo = new THREE.CylinderGeometry(0.22, 0.3, 2, 5);
const coneGeo = new THREE.ConeGeometry(1, 1, 7);
const blobGeo = new THREE.IcosahedronGeometry(1, 0);
const pineMat = mat(0x2f5d50), pineMat2 = mat(0x3d7362), trunkMat = mat(0x5b4636), blobMat = mat(0xd98a6a), blobMat2 = mat(0xc97656);
function makeTree() {
  const root = new THREE.Group(), pine = new THREE.Group(), blob = new THREE.Group();
  const t1 = shadowed(new THREE.Mesh(trunkGeo, trunkMat)); t1.position.y = 1; pine.add(t1);
  [[2.6, 3.4, 2.4], [2.0, 3.0, 4.2], [1.3, 2.6, 5.9]].forEach(([r, h, y], i) => {
    const c = shadowed(new THREE.Mesh(coneGeo, i % 2 ? pineMat2 : pineMat));
    c.scale.set(r, h, r); c.position.y = y; c.rotation.y = i; pine.add(c);
  });
  const t2 = shadowed(new THREE.Mesh(trunkGeo, trunkMat)); t2.scale.y = 2; t2.position.y = 2; blob.add(t2);
  [[0, 5, 0, 1.7], [1.3, 4.2, 0.4, 1.2], [-1.2, 4.4, -0.5, 1.3], [0.2, 6.3, 0.3, 1.1], [-0.3, 4.0, 1.2, 1.1]].forEach(([x, y, z, r], i) => {
    const b = shadowed(new THREE.Mesh(blobGeo, i % 2 ? blobMat2 : blobMat));
    b.position.set(x, y, z); b.scale.setScalar(r); b.rotation.set(i, i * 2, i * 3); blob.add(b);
  });
  root.add(pine, blob); root.userData = { pine, blob, id: null };
  scene.add(root); return root;
}
const BANDS = 18, treePool = Array.from({ length: BANDS * 4 }, makeTree);
function updateTrees(y) {
  const k0 = Math.floor((y - 95) / 8);
  for (let k = k0; k < k0 + BANDS; k++) {
    const band = treesInBand(k);
    for (let i = 0; i < 4; i++) {
      const slot = treePool[(((k % BANDS) + BANDS) % BANDS) * 4 + i], id = k * 4 + i;
      if (slot.userData.id === id) continue;
      const t = band[i];
      slot.userData.id = id; slot.position.set(t.x, 0, t.y); slot.scale.setScalar(t.s);
      slot.rotation.y = id; slot.userData.pine.visible = !t.blob; slot.userData.blob.visible = t.blob;
    }
  }
}

// ---- kicker built from the same ground() profile the simulation uses
function kickerGeometry() {
  const N = 10, w = KICKER.halfW, pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const z = (i / N) * KICKER.len, h = KICKER.h * (i / N) ** 2;
    pos.push(-w, h, z, w, h, z, -w, 0, z, w, 0, z);
  }
  for (let i = 0; i < N; i++) {
    const a = i * 4, b = a + 4;
    idx.push(a, b, a + 1, a + 1, b, b + 1);            // top
    idx.push(a + 2, b + 2, a, a, b + 2, b);            // left side
    idx.push(a + 1, b + 1, a + 3, a + 3, b + 1, b + 3); // right side
  }
  const e = N * 4; idx.push(e, e + 2, e + 1, e + 1, e + 2, e + 3);  // lip face
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const kickGeo = kickerGeometry();
const kickers = [0, 1].map(() => {
  const m = new THREE.Mesh(kickGeo, new THREE.MeshLambertMaterial({ color: 0xf3f7ff, side: THREE.DoubleSide }));
  m.castShadow = m.receiveShadow = true; scene.add(m); return m;
});

// ---- slalom gates
const poleGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.8, 5), flagGeo = new THREE.BoxGeometry(0.9, 0.5, 0.04);
const gates = Array.from({ length: 5 }, () => {
  const g = new THREE.Group();
  const red = new THREE.MeshLambertMaterial({ color: 0xe5433d }), blue = new THREE.MeshLambertMaterial({ color: 0x3b62e0 });
  for (const dx of [-1.6, 1.6]) {
    const p = shadowed(new THREE.Mesh(poleGeo, red)); p.position.set(dx, 0.9, 0);
    const f = shadowed(new THREE.Mesh(flagGeo, red)); f.position.set(dx + 0.45, 1.5, 0);
    g.add(p, f);
  }
  g.userData = { red, blue }; scene.add(g); return g;
});

// ---- rider: an original blocky stand-in (blue top, red trousers, blonde ponytail)
const rider = new THREE.Group(), lean = new THREE.Group();
const box = (w, h, d, c, x, y, z) => { const m = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c))); m.position.set(x, y, z); lean.add(m); return m; };
box(0.34, 0.06, 1.55, 0xffc531, 0, 0.03, 0);            // board
box(0.2, 0.62, 0.22, 0xd9342b, 0, 0.36, 0.3);           // legs
box(0.2, 0.62, 0.22, 0xd9342b, 0, 0.36, -0.3);
box(0.3, 0.2, 0.62, 0xc22a24, 0, 0.72, 0);              // hips
box(0.3, 0.52, 0.42, 0x2f6fe4, 0, 1.06, 0);             // torso
box(0.14, 0.14, 0.95, 0x2f6fe4, 0.02, 1.2, 0);          // arms out
box(0.24, 0.24, 0.24, 0xf0c4a0, 0, 1.46, 0);            // head
box(0.28, 0.12, 0.28, 0xffdd55, 0, 1.6, 0);             // hair
const tail = box(0.1, 0.1, 0.5, 0xffdd55, -0.2, 1.5, -0.3); // ponytail
rider.add(lean); rider.scale.setScalar(1.6); scene.add(rider);

// ---- carved track ribbon
const TRAIL = 260;
const trailGeo = new THREE.BufferGeometry();
const trailPos = new Float32Array(TRAIL * 6);
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
const tIdx = []; for (let i = 0; i < TRAIL - 1; i++) { const a = i * 2; tIdx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
trailGeo.setIndex(tIdx);
const trail = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({ color: 0xbfd0ea, side: THREE.DoubleSide }));
trail.frustumCulled = false; scene.add(trail);
function updateTrail() {
  const t = sim.trail;
  for (let i = 0; i < TRAIL; i++) {
    const p = t[Math.min(i, t.length - 1)] || { x: 0, y: 0 };
    const w = p.gap || (t[i + 1] && t[i + 1].gap) || i >= t.length ? 0 : 0.26;
    trailPos.set([p.x - w, 0.03, p.y, p.x + w, 0.03, p.y], i * 6);
  }
  trailGeo.attributes.position.needsUpdate = true;
}

// ---- powder spray
const SPRAY = 90, sprayPos = new Float32Array(SPRAY * 3);
const sprayGeo = new THREE.BufferGeometry();
sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPos, 3));
const spray = new THREE.Points(sprayGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.55, transparent: true, opacity: 0.85 }));
spray.frustumCulled = false; scene.add(spray);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now(), camX = 0, camLift = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  sim.step(dt);

  rider.position.set(sim.x, sim.h, sim.y);
  rider.rotation.y = sim.heading + sim.spin;
  lean.rotation.z = sim.air ? 0 : -sim.steer * 0.35;
  tail.rotation.y = sim.air ? -sim.steer * 0.9 : 0;

  // camera sits downhill and above, so downhill is toward the bottom of the screen
  camX += (sim.x * 0.6 - camX) * Math.min(1, 4 * dt);
  camLift += ((sim.air ? sim.h * 2.2 : 0) - camLift) * Math.min(1, 3 * dt);
  camera.position.set(camX, 20 + camLift, sim.y + 30 + camLift * 0.6);
  camera.lookAt(camX, 0, sim.y + 5);

  sun.target.position.set(sim.x, 0, sim.y - 10);
  sun.position.set(sim.x - 60, 34, sim.y + 8);
  snow.position.set(0, 0, Math.round(sim.y / 4) * 4);

  updateTrees(sim.y);
  const k = kickerY(sim.y);
  kickers[0].position.z = k;
  kickers[1].position.z = sim.y > k + 40 ? k + PERIOD : k - PERIOD;
  const n0 = Math.floor((sim.y - 20) / 40) - 2;
  gates.forEach((g, i) => {
    const gt = gateAt(n0 + i); g.position.set(gt.x, 0, gt.y);
    g.children.forEach((m) => { m.material = gt.red ? g.userData.red : g.userData.blue; });
  });
  updateTrail();
  for (let i = 0; i < SPRAY; i++) {
    const p = sim.spray[i];
    sprayPos.set(p ? [p.x, p.h, p.y] : [0, -50, 0], i * 3);
  }
  sprayGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
  hud(sim, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.spike = { sim, renderer, ground };
</script>
</body>
</html>
