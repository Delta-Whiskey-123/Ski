<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Spike B: 2D canvas</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#dfe8f2;touch-action:none}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createSim, createHud, treesInBand, gateAt, kickerY, KICKER, PERIOD } from './sim.js';

const sim = createSim();
const hud = createHud('Spike B: 2D canvas, faked depth');
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, S = 1, dpr = 1;
const FORE = 0.6, UP = 0.82;            // foreshortening down-slope, and how tall height draws
const SHX = 1.76, SHY = -0.23;          // shadow offset per metre of height (matches spike A's sun)
const SHADOW = 'rgba(96,126,196,.34)';

function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  S = H / 34;
}
addEventListener('resize', resize); resize();

let camX = 0, zoom = 1;
const px = (x) => W / 2 + (x - camX) * S * zoom;
const py = (y, h = 0) => H * 0.36 + ((y - sim.y) * FORE - h * UP) * S * zoom;

// corduroy stripes as a repeating pattern
const stripe = document.createElement('canvas'); stripe.width = 16; stripe.height = 64;
{ const s = stripe.getContext('2d'); s.fillStyle = 'rgba(150,175,215,.10)'; s.fillRect(0, 0, 5, 64);
  for (let i = 0; i < 10; i++) { s.fillStyle = `rgba(140,165,210,${Math.random() * 0.2})`; s.fillRect(Math.random() * 16, Math.random() * 64, 2, 6); } }
const pattern = g.createPattern(stripe, 'repeat');

function poly(pts, fill) {
  g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
  g.fillStyle = fill; g.fill();
}
const P = (x, y, h = 0) => [px(x), py(y, h)];
const shadowPt = (x, y, h) => P(x + SHX * h, y + SHY * h, 0);

function treeShadow(t) {
  const s = t.s;
  if (t.blob) {
    const [x, y] = shadowPt(t.x, t.y, 5 * s);
    poly([P(t.x - 0.3 * s, t.y), P(t.x + 0.3 * s, t.y), shadowPt(t.x + 0.3, t.y, 3 * s), shadowPt(t.x - 0.3, t.y, 3 * s)], SHADOW);
    g.beginPath(); g.ellipse(x, y, 3.4 * s * S * zoom, 1.5 * s * S * zoom, -0.1, 0, 7); g.fillStyle = SHADOW; g.fill();
  } else {
    poly([P(t.x, t.y - 1.6 * s), P(t.x, t.y + 1.6 * s), shadowPt(t.x, t.y, 7.2 * s)], SHADOW);
  }
}
function tree(t) {
  const s = t.s, k = S * zoom;
  poly([P(t.x - 0.28 * s, t.y), P(t.x + 0.28 * s, t.y), P(t.x + 0.22 * s, t.y, 2.4 * s), P(t.x - 0.22 * s, t.y, 2.4 * s)], '#5b4636');
  if (t.blob) {
    [[0, 5, 1.7], [1.3, 4.2, 1.2], [-1.2, 4.4, 1.3], [0.2, 6.3, 1.1], [-0.4, 3.8, 1.1]].forEach(([dx, hh, r], i) => {
      const [cx, cy] = P(t.x + dx * s, t.y, hh * s), R = r * s * k;
      const pts = Array.from({ length: 6 }, (_, j) => [cx + Math.cos(j * 1.047 + i) * R, cy + Math.sin(j * 1.047 + i) * R * 0.92]);
      poly(pts, i % 2 ? '#c97656' : '#d98a6a');
      poly([pts[2], pts[3], pts[4], [cx, cy]], 'rgba(255,225,200,.28)');
    });
  } else {
    [[2.6, 1.2, 4.6], [2.0, 2.9, 5.9], [1.3, 4.7, 7.3]].forEach(([r, h0, h1]) => {
      const tip = P(t.x, t.y, h1 * s), l = P(t.x - r * s, t.y, h0 * s), rt = P(t.x + r * s, t.y, h0 * s), mid = P(t.x + r * s * 0.15, t.y, h0 * s - 0.4);
      poly([tip, l, mid], '#3f7764'); poly([tip, mid, rt], '#2a5346');
    });
  }
}
function kicker(y0) {
  const w = KICKER.halfW, y1 = y0 + KICKER.len, h = KICKER.h, top = [];
  for (let i = 0; i <= 8; i++) top.push(P(-w, y0 + (i / 8) * KICKER.len, h * (i / 8) ** 2));
  for (let i = 8; i >= 0; i--) top.push(P(w, y0 + (i / 8) * KICKER.len, h * (i / 8) ** 2));
  poly([P(w, y0), P(w, y1), shadowPt(w, y1, h), shadowPt(w, y0 + KICKER.len * 0.5, h * 0.25)], SHADOW);
  const grad = g.createLinearGradient(0, py(y0), 0, py(y1, h));
  grad.addColorStop(0, '#fbfcff'); grad.addColorStop(1, '#e6eefc');
  poly(top, grad);
  poly([P(-w, y1, h), P(w, y1, h), P(w, y1), P(-w, y1)], '#b9c9e6');   // lip face, toward the camera
}
function gate(gt) {
  const c = gt.red ? '#e5433d' : '#3b62e0', k = S * zoom;
  for (const dx of [-1.6, 1.6]) {
    const x = gt.x + dx;
    g.strokeStyle = SHADOW; g.lineWidth = 0.14 * k; g.beginPath(); g.moveTo(...P(x, gt.y)); g.lineTo(...shadowPt(x, gt.y, 1.8)); g.stroke();
    g.strokeStyle = c; g.lineWidth = 0.13 * k; g.beginPath(); g.moveTo(...P(x, gt.y)); g.lineTo(...P(x, gt.y, 1.8)); g.stroke();
    poly([P(x, gt.y, 1.75), P(x + 0.9, gt.y, 1.75), P(x + 0.9, gt.y, 1.25), P(x, gt.y, 1.25)], c);
  }
}
function rider() {
  const a = sim.heading + sim.spin, k = S * zoom * 1.6, h = sim.h;
  const dx = Math.sin(a), dy = Math.cos(a), lean = sim.air ? 0 : sim.steer * 0.25;
  // ground shadow: separates from the rider and shrinks with height
  const [sx, sy] = shadowPt(sim.x, sim.y, h), sh = 1 / (1 + h * 0.12);
  g.save(); g.translate(sx, sy); g.rotate(Math.atan2(dy * FORE, dx)); g.beginPath();
  g.ellipse(0, 0, 0.95 * k * sh, 0.34 * k * sh, 0, 0, 7); g.fillStyle = `rgba(70,100,175,${0.5 * sh + 0.1})`; g.fill(); g.restore();
  const at = (along, up, side = 0) => [px(sim.x + (dx * along + lean * up) * 1.35), py(sim.y + dy * along * 1.35, h + up * 1.35)];
  const line = (p, q, w, c) => { g.strokeStyle = c; g.lineWidth = w * k; g.lineCap = 'round'; g.beginPath(); g.moveTo(...p); g.lineTo(...q); g.stroke(); };
  line(at(-0.78, 0.03), at(0.78, 0.03), 0.3, '#ffc531');           // board
  line(at(-0.3, 0.08), at(-0.12, 0.72), 0.2, '#d9342b');           // legs
  line(at(0.3, 0.08), at(0.12, 0.72), 0.2, '#d9342b');
  line(at(0, 0.74), at(0, 1.22), 0.36, '#2f6fe4');                 // torso
  line(at(-0.5, 1.12), at(0.5, 1.2), 0.13, '#2f6fe4');             // arms
  const [hx, hy] = at(0, 1.46);
  g.fillStyle = '#f0c4a0'; g.beginPath(); g.arc(hx, hy, 0.15 * k, 0, 7); g.fill();
  g.fillStyle = '#ffdd55'; g.beginPath(); g.arc(hx, hy - 0.05 * k, 0.16 * k, Math.PI, 0); g.fill();
  line(at(-0.08, 1.5), at(-0.5, 1.38), 0.1, '#ffdd55');            // ponytail
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  sim.step(dt);
  camX += (sim.x * 0.6 - camX) * Math.min(1, 4 * dt);
  zoom += ((sim.air ? 1 / (1 + sim.h * 0.045) : 1) - zoom) * Math.min(1, 3 * dt);

  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#fbfcff'; g.fillRect(0, 0, W, H);
  g.save(); g.translate(px(0) % 16, (-(sim.y * FORE * S * zoom)) % 64); g.fillStyle = pattern; g.fillRect(-16, -64, W + 32, H + 128); g.restore();

  // carved track
  g.strokeStyle = '#bfd0ea'; g.lineWidth = 0.5 * S * zoom; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  let pen = false;
  for (const p of sim.trail) { if (p.gap) { pen = false; continue; } pen ? g.lineTo(px(p.x), py(p.y)) : g.moveTo(px(p.x), py(p.y)); pen = true; }
  g.stroke();

  // gather everything, shadows first, then objects from the top of the screen down
  const items = [];
  const kb = Math.floor((sim.y - 30) / 8);
  for (let k = kb; k < kb + 12; k++) for (const t of treesInBand(k)) items.push({ y: t.y, shadow: () => treeShadow(t), draw: () => tree(t) });
  const k0 = kickerY(sim.y);
  for (const ky of [k0 - PERIOD, k0, k0 + PERIOD]) items.push({ y: ky + KICKER.len, draw: () => kicker(ky) });
  const n0 = Math.floor((sim.y - 20) / 40) - 1;
  for (let i = 0; i < 4; i++) { const gt = gateAt(n0 + i); items.push({ y: gt.y, draw: () => gate(gt) }); }
  items.push({ y: sim.y + (sim.air ? 0.01 : 0), draw: rider });
  for (const it of items) it.shadow && it.shadow();
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw();

  g.fillStyle = 'rgba(255,255,255,.9)';
  for (const p of sim.spray) { g.beginPath(); g.arc(px(p.x), py(p.y, p.h), (0.28 - p.t * 0.2) * S * zoom, 0, 7); g.fill(); }

  // soft haze toward the far (top) edge
  const haze = g.createLinearGradient(0, 0, 0, H * 0.22);
  haze.addColorStop(0, 'rgba(228,235,244,.9)'); haze.addColorStop(1, 'rgba(228,235,244,0)');
  g.fillStyle = haze; g.fillRect(0, 0, W, H * 0.22);

  hud(sim, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.spike = { sim };
</script>
</body>
</html>
